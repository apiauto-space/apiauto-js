# Publishes to npm when a v* tag is pushed (npm version patch && git push --follow-tags).
# Authentication is npm trusted publishing (OIDC): no NPM_TOKEN secret. Provenance is
# generated automatically. Configure the trusted publisher on npmjs.com first: PUBLISHING.md.
name: Publish to npm

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # OIDC token for npm trusted publishing
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # never use caching in release builds
      - name: Ensure npm >= 11.5.1 (required for trusted publishing)
        run: |
          node -e 'const [a, b, c] = process.argv[1].split(".").map(Number); process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1)' "$(npm --version)" \
            || npm install -g npm@11
          npm --version
      - name: Check that the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Skip versions that are already on npm
        id: published
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$(npm view "$(node -p 'require("./package.json").name')@$version" version 2>/dev/null)" = "$version" ]; then
            echo "Version ${GITHUB_REF_NAME#v} is already on npm, nothing to publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - run: npm publish
        if: steps.published.outputs.skip != 'true'
